<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="55%" cy="40%" r="80%">
      <stop offset="0" stop-color="#3d1f73"/>
      <stop offset="0.55" stop-color="#1b1142"/>
      <stop offset="1" stop-color="#0a0720"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="1" x2="1" y2="0.2">
      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="0.45" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffc23a"/>
    </linearGradient>
    <linearGradient id="flame" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff2e63"/>
      <stop offset="0.5" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ffe14d"/>
    </linearGradient>
    <linearGradient id="core" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#fff6c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6a1a" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="520" cy="540" r="440" fill="url(#glow)"/>
  <g fill="#ffd36b">
    <circle cx="190" cy="220" r="8" opacity="0.8"/>
    <circle cx="282" cy="150" r="5" opacity="0.6"/>
    <circle cx="840" cy="230" r="7" opacity="0.7"/>
    <circle cx="770" cy="140" r="4.5" opacity="0.5"/>
    <circle cx="880" cy="820" r="5" opacity="0.45"/>
    <circle cx="140" cy="860" r="6" opacity="0.4"/>
  </g>

  <g transform="translate(-10 40)">
  <!-- flaming tail sweeping up and back -->
  <path fill="url(#flame)" d="M360 640 C300 650 240 640 200 600 C150 550 140 470 168 400 C176 450 196 480 222 495 C200 440 205 370 245 300 C250 360 268 400 298 425 C290 370 305 300 350 245 C350 320 372 370 405 405 C430 440 440 500 430 560 C425 600 400 630 360 640 Z"/>
  <path fill="url(#core)" d="M362 620 C320 625 275 610 252 575 C230 540 232 495 250 460 C262 500 285 520 310 528 C298 485 305 430 340 385 C345 430 362 465 388 485 C410 515 412 560 400 590 C392 610 380 618 362 620 Z"/>

  <!-- rear leg pushing off -->
  <path fill="#ff4a50" d="M378 655 C352 690 318 712 288 722 C268 728 262 748 280 754 C312 762 350 748 378 724 C398 706 412 690 424 672 Z"/>
  <!-- long arching body -->
  <path fill="url(#fur)" d="M352 690 C330 600 380 500 470 455 C560 410 660 420 730 470 C770 498 795 530 812 562 L790 640 C760 625 720 600 680 590 C620 576 560 585 510 615 C470 640 440 680 420 712 C398 716 368 712 352 690 Z"/>
  <!-- front legs reaching -->
  <path fill="#ff6a2a" d="M690 600 C705 645 720 690 742 722 C752 738 772 738 778 724 C782 700 770 665 752 625 Z"/>
  <path fill="#ff8a2a" d="M640 596 C650 645 660 692 676 728 C684 746 706 746 710 730 C714 704 704 664 692 616 Z"/>

  <!-- head, snout pointing forward-down -->
  <path fill="url(#fur)" d="M720 500 C750 455 815 445 860 470 C895 490 915 525 930 560 C945 592 950 618 938 632 C922 650 885 648 850 640 C805 630 760 610 735 580 C712 553 706 525 720 500 Z"/>
  <!-- ears -->
  <path fill="#ff9a2e" d="M748 480 C735 445 748 418 775 414 C792 424 798 450 790 470 Z"/>
  <path fill="#ffd89a" d="M757 472 C750 448 760 430 776 428 C785 438 787 455 781 466 Z"/>
  <!-- cream muzzle -->
  <path fill="#fff1d8" d="M820 560 C845 535 892 535 920 562 C940 582 946 610 935 626 C918 642 880 640 850 632 C826 624 808 590 820 560 Z"/>
  <!-- bandit mask -->
  <path fill="#2a1438" d="M752 520 C780 488 840 482 885 500 C910 510 928 530 934 552 C914 556 895 552 880 545 C860 538 840 540 820 552 C798 562 775 565 758 556 C745 548 744 532 752 520 Z"/>
  <!-- eye -->
  <ellipse cx="842" cy="517" rx="15" ry="14" fill="#fff6e0"/>
  <circle cx="846" cy="518" r="9" fill="#140a1f"/>
  <circle cx="850" cy="513" r="3.5" fill="#ffffff"/>
  <!-- nose -->
  <path fill="#ff5a7a" d="M928 600 C942 594 955 602 952 616 C948 627 932 628 925 619 C920 612 921 604 928 600 Z"/>
  <path fill="none" stroke="#7a3a4a" stroke-width="5" stroke-linecap="round" d="M934 628 C930 640 914 645 900 638"/>
  <!-- whiskers -->
  <g stroke="#fff1d8" stroke-width="3" stroke-linecap="round" opacity="0.75" fill="none">
    <path d="M905 600 C935 585 965 582 990 586"/>
    <path d="M905 610 C938 606 968 612 992 622"/>
  </g>
  <!-- trailing ember wisps off the back -->
  <path fill="url(#flame)" opacity="0.9" d="M520 438 C500 400 505 365 525 338 C530 368 548 385 565 405 C560 420 540 430 520 438 Z"/>
  <path fill="url(#flame)" opacity="0.75" d="M600 422 C590 390 598 360 620 340 C622 365 636 380 648 400 C635 412 618 418 600 422 Z"/>
  </g>
</svg>
