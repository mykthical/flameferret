name: Build Flameferret

on:
  workflow_dispatch: {}
  push:
    branches: [main, flameferret]
    paths-ignore:
      - "**.md"

concurrency:
  group: flameferret-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Build IPA
        run: ./scripts/flameferret-build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Flameferret-ipa
          path: build/flameferret/Flameferret.ipa
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7
