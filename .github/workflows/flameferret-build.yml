name: Build Culpeo

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/**"

permissions:
  contents: write

concurrency:
  group: flameferret-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26.5*.app 2>/dev/null | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1); fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: NordVPN relay self-test
        run: ./scripts/ferret-relay-selftest/run.sh

      - name: Build IPA
        run: ./scripts/flameferret-build-ipa.sh

      - name: Report build errors
        if: failure()
        run: |
          LOG=build/xcodebuild.log
          if [ ! -f "$LOG" ]; then echo "::error title=No xcodebuild log::The build failed before xcodebuild ran"; exit 0; fi
          grep -E "^/.*:[0-9]+:[0-9]+: error: " "$LOG" | sort -u | head -40 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1 | sed "s|^$GITHUB_WORKSPACE/||")
            ln=$(echo "$line" | cut -d: -f2)
            msg=$(echo "$line" | cut -d: -f5- | sed 's/^ *//')
            echo "::error file=$file,line=$ln,title=compile::$msg"
          done
          grep -E "error:|\*\* BUILD FAILED|Command .* failed" "$LOG" | grep -v "^/.*:[0-9]*:[0-9]*: error" | sort -u | head -15 | while IFS= read -r line; do
            echo "::error title=build::$(echo "$line" | cut -c1-900)"
          done
          tail -5 "$LOG" | while IFS= read -r line; do echo "::notice title=log tail::$(echo "$line" | cut -c1-900)"; done

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Culpeo-ipa
          path: build/flameferret/Culpeo.ipa
          retention-days: 30

      - name: Publish IPA to the ipa-builds branch
        run: |
          cd build/flameferret
          SIZE=$(stat -f%z Culpeo.ipa)
          echo "::notice title=IPA size::$((SIZE / 1048576)) MB"
          mkdir publish && cd publish
          if [ "$SIZE" -lt 99000000 ]; then
            cp ../Culpeo.ipa Culpeo.ipa
          else
            split -b 45m ../Culpeo.ipa Culpeo.ipa.part-
          fi
          shasum -a 256 ../Culpeo.ipa | cut -d' ' -f1 > Culpeo.ipa.sha256
          echo "${GITHUB_SHA}" > SOURCE_COMMIT
          git init -q -b ipa-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Culpeo IPA from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ipa-builds

      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "flameferret-${GITHUB_SHA::7}" build/flameferret/Culpeo.ipa \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Culpeo (${GITHUB_SHA::7})" \
            --notes "Unsigned IPA for sideloading with SideStore, AltStore or Sideloadly. See FLAMEFERRET.md."

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          retention-days: 7
