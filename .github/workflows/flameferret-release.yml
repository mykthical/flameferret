name: Publish Flameferret release

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/flameferret-release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish latest IPA
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the latest IPA build
        run: |
          git clone -q --depth 1 -b ipa-builds "https://github.com/${{ github.repository }}.git" ipa
          cd ipa
          cat Flameferret.ipa.part-* > ../Flameferret.ipa
          echo "$(cat Flameferret.ipa.sha256)  ../Flameferret.ipa" | sha256sum -c
          echo "SOURCE=$(cut -c1-7 SOURCE_COMMIT)" >> "$GITHUB_ENV"
          echo "SOURCE_FULL=$(cat SOURCE_COMMIT)" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flameferret-${SOURCE}"
          echo "::notice::Publishing $TAG ($(du -h Flameferret.ipa | cut -f1))"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          if ! out=$(gh release create "$TAG" Flameferret.ipa \
                --repo "$GITHUB_REPOSITORY" \
                --target "$SOURCE_FULL" \
                --title "Flameferret ($SOURCE)" \
                --notes "Unsigned IPA for sideloading with SideStore, AltStore or Sideloadly. Built from $SOURCE. See FLAMEFERRET.md for setup and which extensions work." 2>&1); then
            echo "::error::$(echo "$out" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          echo "::notice::$out"
