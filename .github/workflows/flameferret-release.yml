name: Publish Flameferret release

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/flameferret-release.yml

permissions:
  contents: write

jobs:
  release:
    name: Publish latest IPA
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the latest IPA build
        run: |
          git clone -q --depth 1 -b ipa-builds "https://github.com/${{ github.repository }}.git" ipa
          cd ipa
          cat Flameferret.ipa.part-* > ../Flameferret.ipa
          echo "$(cat Flameferret.ipa.sha256)  ../Flameferret.ipa" | sha256sum -c
          echo "SOURCE=$(cut -c1-7 SOURCE_COMMIT)" >> "$GITHUB_ENV"
          echo "SOURCE_FULL=$(cat SOURCE_COMMIT)" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(unzip -p Flameferret.ipa Payload/Flameferret.app/Info.plist | plistutil -i - -f xml 2>/dev/null \
            | grep -A1 CFBundleShortVersionString | tail -1 | sed 's/<[^>]*>//g;s/[[:space:]]//g' || true)
          TAG="flameferret-${VERSION:-build}-${SOURCE}"
          gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" Flameferret.ipa \
            --repo "${{ github.repository }}" \
            --target "$SOURCE_FULL" \
            --title "Flameferret ${VERSION} (${SOURCE})" \
            --latest \
            --notes "Unsigned IPA for sideloading with SideStore, AltStore or Sideloadly. Built from ${SOURCE}. See FLAMEFERRET.md for setup and which extensions work."
